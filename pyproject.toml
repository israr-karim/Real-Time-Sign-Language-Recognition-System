[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Retain historical calculations while the model behavior is reviewed separately.
"src/sign_language_lab/attention.py" = ["F841"]
"src/sign_language_lab/vivit_translation.py" = ["F841"]
"src/sign_language_lab/vivit_gloss_recognition.py" = ["F841"]
"src/sign_language_lab/videomae_experiment.py" = ["F841"]
